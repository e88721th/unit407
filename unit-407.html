<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>陳樵國語文</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Noto Sans TC', system-ui, sans-serif; }
    .option-btn { 
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
      /* 調整手機版內距與字體大小，避免過度佔用空間 */
      padding: 0.6rem 1rem; 
      font-size: 1rem; 
      display: flex; 
      align-items: flex-start;
      text-align: left;
      line-height: 1.4;
    }
    @media (min-width: 640px) {
      .option-btn {
        padding: 1rem;
        font-size: 1.25rem; /* 電腦版維持原本較大字體 */
      }
    }
    .option-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgb(0 0 0 / 0.1); }
    .confetti { 
      position: absolute; 
      width: 10px; 
      height: 10px; 
      border-radius: 50%; 
      animation: fall 1.8s linear forwards; 
      top: -20px; 
      pointer-events: none;
    }
    @keyframes fall { 
      0% { transform: translateY(0) rotate(0deg); opacity: 1; }
      50% { transform: translateY(300px) rotate(360deg); }
      100% { transform: translateY(500px) rotate(720deg); opacity: 0; }
    }
    /* 將容器改為 Flex 排版，並允許內部滾動 */
    #quiz-container { 
      display: flex;
      flex-direction: column;
      height: calc(100vh - 120px); /* 扣掉上方標題列的空間 */
      max-height: 800px;
      overflow: hidden; 
      padding: 1rem; 
    }
    .disabled-btn { opacity: 0.6; pointer-events: none; }
  </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-rose-50 min-h-screen pb-4">
  <div class="max-w-2xl mx-auto p-4 h-screen flex flex-col">
    <div class="flex justify-between items-center mb-4 shrink-0">
      <div class="flex items-center gap-2">
        <span class="text-4xl sm:text-5xl">🎓</span>
        <h3 class="text-2xl sm:text-3xl font-bold text-indigo-700">小四-單元-多音字</h3>
      </div>
      <button onclick="location.reload()" class="px-4 py-2 bg-gray-200 hover:bg-gray-300 rounded-full text-sm font-bold text-gray-700 transition">返回</button>
    </div>
    
    <!-- 測驗容器：設定 flex-1 讓它自適應高度 -->
    <div id="quiz-container" class="bg-white rounded-3xl shadow-2xl flex-1 relative"></div>
  </div>

  <script>
    const DEBUG = true;
    const TIME_LIMIT = 60;
    let allQuestions = [], questions = [], wrongQuestions = [], current = 0, score = 0;
    let timerInterval, timeLeft = TIME_LIMIT;
    let username = '', currentUnit = '';
    let isTimeout = false;
    let currentShuffled = [];
    let currentOriginalToNew = {};

    async function loadQuestions() {
      try {
        const res = await fetch('unit-407多音字.json');
        allQuestions = await res.json();
        showWelcomeScreen();
      } catch (e) {
        document.getElementById('quiz-container').innerHTML = `<div class="text-center py-20 text-red-600">❌ 無法載入題目，請確認 JSON 檔案存在</div>`;
      }
    }

    function showWelcomeScreen() {
      document.getElementById('quiz-container').innerHTML = `
        <div class="text-center py-16 flex flex-col justify-center h-full">
          <div class="text-7xl mb-6">📝</div>
          <h3 class="text-3xl font-bold text-indigo-700 mb-3">熟能生巧練功坊</h3>
          <div class="mt-auto pb-10">
            <button onclick="showUnitSelection()" class="w-64 py-5 bg-indigo-600 text-white text-2xl font-medium rounded-3xl shadow-xl">進入</button>
          </div>
        </div>
      `;
    }

    function showUnitSelection() {
      let html = `<div class="text-center py-4 overflow-y-auto h-full flex flex-col"><h2 class="text-2xl sm:text-3xl font-bold mb-6">請選擇測驗關卡</h2>
        <div class="grid grid-cols-4 sm:grid-cols-5 gap-2 sm:gap-3 mb-6">` + 
        [1,2,3,4,5,6,7,8].map(i => `<button onclick="startUnit(${i})" class="py-4 bg-white border rounded-2xl font-medium hover:bg-indigo-50">關卡 ${i}</button>`).join('') + 
        `</div><div class="mt-auto pb-4"><button onclick="startAllUnits()" class="w-full py-4 bg-amber-400 text-white text-xl font-medium rounded-3xl">📚 全部混合</button></div></div>`;
      document.getElementById('quiz-container').innerHTML = html;
    }

    function startUnit(u) { questions = shuffle(allQuestions.filter(q => q.unit === u)); currentUnit = u; resetQuiz(); }
    function startAllUnits() { questions = shuffle([...allQuestions]); currentUnit = '全'; resetQuiz(); }
    function resetQuiz() { current = 0; score = 0; wrongQuestions = []; isTimeout = false; loadQuestion(); }
    function shuffle(a) { return [...a].sort(() => Math.random() - 0.5); }

    function adjustExplanation(explanation, originalToNew) {
      return explanation.replace(/選項([A-D])/g, (match, letter) => {
        const originalIdx = letter.charCodeAt(0) - 65;
        const newIdx = originalToNew[originalIdx];
        return newIdx !== undefined ? '選項' + String.fromCharCode(65 + newIdx) : match;
      });
    }

    function loadQuestion() {
      const q = questions[current];
      if (typeof q.answer !== 'number') { q.answer = parseInt(q.answer, 10) || 0; }
      const shuffledOptions = shuffle([...q.options]);
      const correctIndex = shuffledOptions.indexOf(q.options[q.answer]);
      const originalToNew = {};
      q.options.forEach((opt, idx) => { originalToNew[idx] = shuffledOptions.indexOf(opt); });
      currentShuffled = shuffledOptions;
      currentOriginalToNew = originalToNew;

      // 調整排版結構：題目與選項在上方，按鈕與回饋在下方
      document.getElementById('quiz-container').innerHTML = `
        <div class="flex flex-col h-full">
          <!-- 頂部狀態列 -->
          <div class="flex justify-between mb-2 text-sm font-medium shrink-0">
            <span>關卡 ${q.unit} • 第 <span id="q-number">${current+1}</span> / ${questions.length}</span>
            <span id="timer" class="font-mono text-orange-600">${TIME_LIMIT}</span>
          </div>
          
          <!-- 題目與選項區塊 (設定 overflow-y-auto 以防選項過多) -->
          <div class="flex-1 overflow-y-auto pr-1">
            <div class="text-xl sm:text-2xl font-medium mb-4">${current + 1}. ${q.question}</div>
            <div class="grid gap-2 sm:gap-3 pb-2">${shuffledOptions.map((o,i) => `
              <button onclick="selectOption(${i}, ${correctIndex}, '${q.explanation}')" 
                      class="option-btn bg-gray-50 border rounded-2xl sm:rounded-3xl text-left items-start">
                <span class="font-bold mr-2">${String.fromCharCode(65+i)}.</span> 
                <span>${o}</span>
              </button>`).join('')}
            </div>
          </div>
          
          <!-- 底部回饋與下一題按鈕 (固定在下方的區塊) -->
          <div id="feedback" class="hidden shrink-0 mt-2"></div>
        </div>
      `;
      isTimeout = false;
      startTimer();
    }

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = TIME_LIMIT;
      const timerEl = document.getElementById('timer');
      timerInterval = setInterval(() => {
        timeLeft--;
        if (timerEl) { timerEl.textContent = timeLeft; if (timeLeft <= 10) timerEl.classList.add('text-red-600'); }
        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          if (!isTimeout) {
            isTimeout = true;
            wrongQuestions.push(questions[current]);
            const q = questions[current];
            const adjustedExp = adjustExplanation(q.explanation, currentOriginalToNew);
            document.getElementById('feedback').innerHTML = `<div class="p-3 sm:p-4 rounded-2xl bg-red-100 text-sm sm:text-base">⏰ 時間到！正確答案：${q.options[q.answer]}<br>${adjustedExp}</div>
                <button onclick="nextQuestion()" class="mt-2 w-full py-3 bg-indigo-600 text-white rounded-2xl font-medium">下一題</button>`;
            document.getElementById('feedback').classList.remove('hidden');
            document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled-btn'));
          }
        }
      }, 1000);
    }

    window.selectOption = function(selectedIdx, correctIdx, rawExplanation) {
      if (isTimeout) return;
      clearInterval(timerInterval);
      const isCorrect = (selectedIdx === correctIdx);
      const adjustedExp = adjustExplanation(rawExplanation, currentOriginalToNew);
      
      if (isCorrect) { 
        score++; 
        playSound(true);
        createConfetti();
      } else { 
        wrongQuestions.push(questions[current]); 
        playSound(false);
      }
      
      const feedback = document.getElementById('feedback');
      feedback.innerHTML = `<div class="p-3 sm:p-4 rounded-2xl ${isCorrect?'bg-green-100':'bg-red-100'} text-sm sm:text-base">
          ${isCorrect ? '🎉 答對！' : '😔 答錯'} - ${adjustedExp}</div>
          <button onclick="nextQuestion()" class="mt-2 w-full py-3 sm:py-4 bg-indigo-600 text-white rounded-2xl font-medium">
            ${current < questions.length-1 ? '下一題' : '查看成績'}
          </button>`;
      feedback.classList.remove('hidden');
      document.querySelectorAll('.option-btn').forEach(b => b.classList.add('disabled-btn'));
    };

    function playSound(isCorrect) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = isCorrect ? 'sine' : 'sawtooth';
        osc.frequency.setValueAtTime(isCorrect ? 880 : 420, ctx.currentTime);
        gain.gain.setValueAtTime(0.4, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + (isCorrect ? 0.55 : 0.8));
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + (isCorrect ? 0.6 : 0.9));
      } catch(e) {}
    }

    function createConfetti() {
      for (let i = 0; i < 120; i++) {
        const c = document.createElement('div');
        c.className = 'confetti';
        c.style.left = Math.random() * 100 + 'vw';
        c.style.backgroundColor = ['#6366f1','#a855f7','#ec4899','#eab308','#22c55e'][Math.floor(Math.random()*5)];
        c.style.animationDuration = (Math.random() * 1.2 + 1.3) + 's';
        c.style.opacity = Math.random() * 0.7 + 0.6;
        document.body.appendChild(c);
        setTimeout(() => c.remove(), 2800);
      }
    }

    window.nextQuestion = function() { current++; current < questions.length ? loadQuestion() : showResult(); };

    function showResult() {
      const pct = Math.round((score / questions.length) * 100);
      const scores = JSON.parse(localStorage.getItem('idiomHighScores') || '[]');
      scores.push({ score: pct, unit: currentUnit || '全', date: new Date().toLocaleDateString() });
      localStorage.setItem('idiomHighScores', JSON.stringify(scores.sort((a,b) => b.score - a.score)));
      
      document.getElementById('quiz-container').innerHTML = `
        <div class="text-center flex flex-col justify-center h-full">
          <h2 class="text-4xl font-bold mb-6">${pct}% 正確率</h2>
          <div class="grid grid-cols-2 gap-3 pb-6 px-4">
            ${wrongQuestions.length > 0 ? `<button onclick="startReview()" class="py-4 bg-orange-500 text-white rounded-3xl col-span-2">重練錯題 (${wrongQuestions.length})</button>` : ''}
            <button onclick="showLeaderboard()" class="py-4 bg-green-600 text-white rounded-3xl">看成績</button>
            <button onclick="showUnitSelection()" class="py-4 bg-blue-600 text-white rounded-3xl">選單元</button>
            <button onclick="location.reload()" class="py-4 bg-indigo-600 text-white rounded-3xl col-span-2">回到首頁</button>
          </div>
        </div>`;
    }

    window.startReview = function() { questions = shuffle([...wrongQuestions]); current = 0; score = 0; wrongQuestions = []; isTimeout = false; loadQuestion(); };

    window.showLeaderboard = function() {
      const s = JSON.parse(localStorage.getItem('idiomHighScores') || '[]');
      document.getElementById('quiz-container').innerHTML = `
        <div class="h-full flex flex-col pt-2">
          <h2 class="text-2xl font-bold mb-4 shrink-0">🏆 成績榜</h2>
          <div class="flex-1 overflow-y-auto">
            <table class="w-full text-left text-sm">
              <thead>
                <tr class="border-b-2 border-gray-300 text-gray-600">
                  <th class="py-2">名次</th>
                  <th class="py-2">單元</th>
                  <th class="py-2">正確率</th>
                  <th class="py-2">日期</th>
                </tr>
              </thead>
              <tbody>
                ${s.map((x,i) => `
                  <tr class="border-b">
                    <td class="py-2">${i+1}</td>
                    <td class="py-2">${x.unit}</td>
                    <td class="py-2 font-bold">${x.score}%</td>
                    <td class="py-2 text-gray-500">${x.date}</td>
                  </tr>`).join('')}
              </tbody>
            </table>
          </div>
          <button onclick="location.reload()" class="mt-4 w-full py-3 bg-gray-200 rounded-3xl shrink-0">返回</button>
        </div>`;
    };

    window.onload = loadQuestions;
  </script>
</body>
</html>
